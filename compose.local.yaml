services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: so
      POSTGRES_PASSWORD: so
      POSTGRES_DB: so
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://so:so@db:5432/so
      ORIGEN_PERMITIDO: http://localhost:8080
    ports:
      - "8000:8000"
    depends_on:
      - db
