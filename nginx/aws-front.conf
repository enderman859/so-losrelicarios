# /etc/nginx/sites-available/front  (EC2 AWS) - sitio estatico, version final con HTTPS (Certbot)
server {
    server_name losrelicarios.scaleautomatization.tech;

    root /var/www/losrelicarios;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/losrelicarios.scaleautomatization.tech/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/losrelicarios.scaleautomatization.tech/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = losrelicarios.scaleautomatization.tech) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name losrelicarios.scaleautomatization.tech;
    return 404; # managed by Certbot


